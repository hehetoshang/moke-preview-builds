# Actions-only public repository. Source is fetched from private main at runtime.
# Triggers: Run workflow -> Actions Artifacts only; preview-vX.Y.Z.N -> public Latest release.
# A four-part tag maps to the source SemVer X.Y.Z-N. MSI requires a numeric prerelease.
# Required secrets: MOKE_SOURCE_DEPLOY_KEY (read-only), MOKE_PREVIEW_ENTITLEMENT_URL,
# MOKE_PREVIEW_ENTITLEMENT_PUBLIC_KEY (pinned Ed25519 key, not downloaded on each run).
# Android and OHOS release signing secrets are also required.
# Build caches and plaintext compiler logs must not be published here.
# Failure diagnostics are encrypted to MOKE_DIAGNOSTICS_CERT_BASE64; the private key stays offline.
# This workflow preserves the private source's Preview gate, capabilities and feature.
name: Build Moke Preview
'on':
  push:
    tags:
    - preview-v*
  workflow_dispatch:
    inputs:
      mobile_diagnostics:
        description: Build only iOS and OHOS to diagnose mobile failures
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve private main and validate configuration
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      public_version: ${{ steps.source.outputs.public_version }}
    steps:
    - name: Checkout private source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: hehetoshang/moke
        ref: main
        path: source
        ssh-key: ${{ secrets.MOKE_SOURCE_DEPLOY_KEY }}
        persist-credentials: false
        submodules: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Validate source version and Preview trust root
      id: source
      shell: bash
      env:
        MOKE_PREVIEW_ENTITLEMENT_URL: ${{ secrets.MOKE_PREVIEW_ENTITLEMENT_URL }}
        MOKE_PREVIEW_ENTITLEMENT_PUBLIC_KEY: ${{ secrets.MOKE_PREVIEW_ENTITLEMENT_PUBLIC_KEY }}
      run: |-
        set -euo pipefail
        node <<'JS'
        const fs = require('node:fs');
        const cp = require('node:child_process');
        const pkg = JSON.parse(fs.readFileSync('source/package.json', 'utf8'));
        const version = pkg.version;
        if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid source version');
        let publicVersion = version;
        if (process.env.GITHUB_REF_TYPE === 'tag') {
          const match = /^preview-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\.([1-9]\d*)$/.exec(process.env.GITHUB_REF_NAME);
          if (!match || Number(match[4]) > 65535) throw new Error('Expected preview-vX.Y.Z.N with 1 <= N <= 65535 for MSI');
          publicVersion = match.slice(1).join('.');
          const internalVersion = `${match[1]}.${match[2]}.${match[3]}-${match[4]}`;
          if (version !== internalVersion) throw new Error('Preview tag does not match package.json on private main');
        }
        for (const name of ['MOKE_PREVIEW_ENTITLEMENT_URL', 'MOKE_PREVIEW_ENTITLEMENT_PUBLIC_KEY']) {
          if (!process.env[name]?.trim()) throw new Error(`Missing Actions secret: ${name}`);
        }
        const u = new URL(process.env.MOKE_PREVIEW_ENTITLEMENT_URL);
        if (u.protocol !== 'https:' || u.username || u.password || u.search || u.hash) throw new Error('Invalid entitlement URL');
        const key = process.env.MOKE_PREVIEW_ENTITLEMENT_PUBLIC_KEY;
        if (!/^[A-Za-z0-9_+/-]+={0,2}$/.test(key) || Buffer.from(key, 'base64url').length !== 32) throw new Error('Invalid Ed25519 public key');
        const sha = cp.execFileSync('git', ['-C', 'source', 'rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\nversion=${version}\npublic_version=${publicVersion}\n`);
        fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Preview ${publicVersion} (internal ${version})\n\nAll jobs use the same private main revision. Manual runs retain artifacts; version tags publish a public release marked as Latest. Android and OHOS packages are release-signed; iOS packages are unsigned; automatic updating is disabled.\n`);
        JS
  build:
    name: Preview / ${{ matrix.id }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      NEXT_BUILD_WORKERS: '2'
      NEXT_BUILD_OPTIMIZER_WORKERS: '2'
      NEXT_PUBLIC_PREVIEW_UPDATER_ENABLED: 'false'
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_ID: ${{ matrix.id }}
      BUILD_PUBLIC_VERSION: ${{ needs.resolve.outputs.public_version }}
      MOKE_PREVIEW_ENTITLEMENT_URL: ${{ secrets.MOKE_PREVIEW_ENTITLEMENT_URL }}
      MOKE_PREVIEW_ENTITLEMENT_PUBLIC_KEY: ${{ secrets.MOKE_PREVIEW_ENTITLEMENT_PUBLIC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.mobile_diagnostics && '[{"id":"ios-arm64","platform":"ios","os":"macos-15","target":"aarch64-apple-ios"},{"id":"ohos-arm64","platform":"ohos","os":"ubuntu-22.04","target":"aarch64-unknown-linux-ohos"}]' || '[{"id":"windows-x64","platform":"windows","os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"id":"linux-x64","platform":"linux","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"id":"macos-arm64","platform":"macos","os":"macos-15","target":"aarch64-apple-darwin"},{"id":"macos-x64","platform":"macos","os":"macos-15-intel","target":"x86_64-apple-darwin"},{"id":"android-arm64","platform":"android","os":"ubuntu-22.04","target":"aarch64-linux-android"},{"id":"ios-arm64","platform":"ios","os":"macos-15","target":"aarch64-apple-ios"},{"id":"ohos-arm64","platform":"ohos","os":"ubuntu-22.04","target":"aarch64-unknown-linux-ohos"}]') }}
    steps:
    - name: Checkout private source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: hehetoshang/moke
        ref: ${{ needs.resolve.outputs.sha }}
        path: source
        ssh-key: ${{ secrets.MOKE_SOURCE_DEPLOY_KEY }}
        persist-credentials: false
        submodules: false
    - name: Checkout pinned public submodules
      shell: bash
      run: |
        set -euo pipefail
        if ! bash --noprofile --norc -e -o pipefail > "$RUNNER_TEMP/moke-private-build.log" 2>&1 <<'PRIVATE_BUILD'
        git submodule sync --recursive
        git submodule update --init --recursive
        PRIVATE_BUILD
        then
          echo "::error::Private build step failed. Compiler output was withheld to keep private source out of public logs. Download the encrypted diagnostics artifact and decrypt it locally for details."
          exit 1
        fi
    - name: Setup pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      with:
        version: 9.15.9
        run_install: false
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        targets: ${{ matrix.target }}
    - name: Install Linux desktop dependencies
      if: matrix.platform == 'linux'
      run: |-
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - name: Setup Java
      if: matrix.platform == 'android' || matrix.platform == 'ohos'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android SDK packages
      if: matrix.platform == 'android'
      run: |-
        set -euo pipefail
        : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
        export ANDROID_HOME
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
        echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
    - name: Install XcodeGen
      if: matrix.platform == 'ios'
      run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
    - name: Install OHOS host dependencies
      if: matrix.platform == 'ohos'
      run: |-
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev jq
    - name: Setup HarmonyOS SDK
      if: matrix.platform == 'ohos'
      uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721
      with:
        version: 6.1.1.280
        cache: false
    - name: Restore Node after SDK setup
      if: matrix.platform == 'ohos'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install private project dependencies
      shell: bash
      run: |
        set -euo pipefail
        if ! bash --noprofile --norc -e -o pipefail > "$RUNNER_TEMP/moke-private-build.log" 2>&1 <<'PRIVATE_BUILD'
        pnpm install --frozen-lockfile
        cd readest
        pnpm install --no-frozen-lockfile
        pnpm --filter @readest/readest-app setup-vendors
        PRIVATE_BUILD
        then
          echo "::error::Private build step failed. Compiler output was withheld to keep private source out of public logs. Download the encrypted diagnostics artifact and decrypt it locally for details."
          exit 1
        fi
    - name: Prepare Preview configuration
      shell: bash
      run: |
        set -euo pipefail
        if ! bash --noprofile --norc -e -o pipefail > "$RUNNER_TEMP/moke-private-build.log" 2>&1 <<'PRIVATE_BUILD'
        node <<'JS'
        const fs = require('node:fs');
        const platform = process.env.BUILD_PLATFORM;
        const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.preview.conf.json', 'utf8'));
        if (cfg.identifier !== 'org.houheya.moke.preview') throw new Error('Unexpected Preview identity');
        // Keep the Preview frontend command: the source build.rs validates it together
        // with the identifier and Cargo feature. Never substitute the stable frontend.
        cfg.build.beforeBuildCommand = 'pnpm build:preview && pnpm build:reader && pnpm copy:reader';
        if (platform === 'ohos') {
          const ohos = JSON.parse(fs.readFileSync('src-tauri/tauri.preview.ohos.conf.json', 'utf8'));
          cfg.identifier = ohos.identifier;
          cfg.app.security.capabilities = ohos.app.security.capabilities;
          cfg.build.beforeBuildCommand += ' && node scripts/prepare-ohos.mjs';
        }
        cfg.bundle.createUpdaterArtifacts = false;
        // Empty endpoints disable update checks. Override the base public key too,
        // so these packages neither inherit Stable's updater identity nor need
        // a Preview updater key. Package signing is independent of updater signing.
        cfg.plugins.updater = {...cfg.plugins.updater, endpoints: [], pubkey: ''};
        if (process.env.NEXT_PUBLIC_PREVIEW_UPDATER_ENABLED !== 'false') {
          throw new Error('Automatic updates must remain disabled for this workflow');
        }
        if (platform === 'linux') cfg.bundle.targets = ['deb', 'appimage'];
        if (platform === 'windows') cfg.bundle.targets = ['nsis', 'msi'];
        if (platform === 'macos') cfg.bundle.targets = ['dmg'];
        if (platform === 'ios') cfg.bundle.iOS = {...cfg.bundle.iOS, minimumSystemVersion: '17.0'};
        fs.writeFileSync('src-tauri/tauri.preview.ci.conf.json', JSON.stringify(cfg, null, 2));
        JS
        PRIVATE_BUILD
        then
          echo "::error::Private build step failed. Compiler output was withheld to keep private source out of public logs. Download the encrypted diagnostics artifact and decrypt it locally for details."
          exit 1
        fi
    - name: Build Preview desktop bundles
      shell: bash
      run: |
        set -euo pipefail
        if ! bash --noprofile --norc -e -o pipefail > "$RUNNER_TEMP/moke-private-build.log" 2>&1 <<'PRIVATE_BUILD'
        pnpm tauri build --target "$BUILD_TARGET" --config src-tauri/tauri.preview.ci.conf.json --features preview
        PRIVATE_BUILD
        then
          echo "::error::Private build step failed. Compiler output was withheld to keep private source out of public logs. Download the encrypted diagnostics artifact and decrypt it locally for details."
          exit 1
        fi
      if: contains(fromJSON('["macos","linux","windows"]'), matrix.platform)
    - name: Build unsigned Preview Android APK
      shell: bash
      run: |
        set -euo pipefail
        if ! bash --noprofile --norc -e -o pipefail > "$RUNNER_TEMP/moke-private-build.log" 2>&1 <<'PRIVATE_BUILD'
        pnpm tauri android init --ci --config src-tauri/tauri.preview.ci.conf.json
        node scripts/prepare-mobile-app-names.mjs android
        pnpm tauri icon src-tauri/icons/icon.png
        python3 - <<'PY'
        from pathlib import Path
        import re
        for p in Path('src-tauri/gen/android/app/src/main/java').rglob('MainActivity.kt'):
            text = Path('src-tauri/android/MainActivity.kt').read_text()
            package = re.search(r'^package\s+[^\n;]+', p.read_text(), re.M).group()
            p.write_text(re.sub(r'^package\s+[^\n;]+', package, text, count=1, flags=re.M))
        p = Path('src-tauri/gen/android/app/build.gradle.kts')
        s = p.read_text()
        if 'missingDimensionStrategy' not in s:
            s, count = re.subn(r'(defaultConfig\s*\{)', r'\1\n        missingDimensionStrategy("store", "foss")', s, count=1)
            assert count == 1
            p.write_text(s)
        PY
        pnpm tauri android build --ci --target aarch64 --config src-tauri/tauri.preview.ci.conf.json --features preview
        PRIVATE_BUILD
        then
          echo "::error::Private build step failed. Compiler output was withheld to keep private source out of public logs. Download the encrypted diagnostics artifact and decrypt it locally for details."
          exit 1
        fi
      if: matrix.platform == 'android'
    - name: Sign and verify Preview Android packages
      if: matrix.platform == 'android'
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: python3 scripts/sign-android-release.py
    - name: Build unsigned Preview iOS archive
      shell: bash
      run: |
        set -euo pipefail
        if ! bash --noprofile --norc -e -o pipefail > "$RUNNER_TEMP/moke-private-build.log" 2>&1 <<'PRIVATE_BUILD'
        pnpm tauri ios init --ci --config src-tauri/tauri.preview.ci.conf.json
        node scripts/prepare-mobile-app-names.mjs ios --config src-tauri/tauri.preview.ci.conf.json
        pnpm tauri ios build --ci --target aarch64 --no-sign --archive-only --config src-tauri/tauri.preview.ci.conf.json --features preview
        PRIVATE_BUILD
        then
          echo "::error::Private build step failed. Compiler output was withheld to keep private source out of public logs. Download the encrypted diagnostics artifact and decrypt it locally for details."
          exit 1
        fi
      if: matrix.platform == 'ios'
    - name: Build Preview OpenHarmony HAP
      shell: bash
      run: |
        set -euo pipefail
        if ! bash --noprofile --norc -e -o pipefail > "$RUNNER_TEMP/moke-private-build.log" 2>&1 <<'PRIVATE_BUILD'
        export OHOS_HOME="$OHOS_NDK_HOME"
        export CC_aarch64_unknown_linux_ohos="$OHOS_NDK_HOME/native/llvm/bin/clang"
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER="$OHOS_NDK_HOME/native/llvm/bin/clang"
        cargo install ohrs --git https://github.com/ohos-rs/ohos-rs --branch ohos
        node scripts/patch-tauri-ohos-identifier.mjs
        cargo build --manifest-path vendor/tauri/Cargo.toml -p tauri-cli --no-default-features --features rustls --locked
        export PATH="$PWD/vendor/tauri/target/debug:$PATH"
        cargo tauri ohos init --ci --config src-tauri/tauri.ohos.conf.json --config src-tauri/tauri.preview.ci.conf.json
        cargo tauri icon src-tauri/icons/icon.png
        (cd src-tauri/gen/ohos && ohpm install)
        node scripts/prepare-ohos.mjs
        node scripts/prepare-ohos-release.mjs
        cargo tauri ohos build --target aarch64 --config src-tauri/tauri.ohos.conf.json --config src-tauri/tauri.preview.ci.conf.json --features preview
        PRIVATE_BUILD
        then
          echo "::error::Private build step failed. Compiler output was withheld to keep private source out of public logs. Download the encrypted diagnostics artifact and decrypt it locally for details."
          exit 1
        fi
      if: matrix.platform == 'ohos'
    - name: Sign and verify Preview OHOS packages
      if: matrix.platform == 'ohos'
      env:
        OHOS_KEYSTORE_BASE64: ${{ secrets.OHOS_KEYSTORE_BASE64 }}
        OHOS_KEYSTORE_PASSWORD: ${{ secrets.OHOS_KEYSTORE_PASSWORD }}
        OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
        OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
        OHOS_APP_CERT_BASE64: ${{ secrets.OHOS_APP_CERT_BASE64 }}
        OHOS_PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_BASE64 }}
      run: python3 scripts/sign-ohos-release.py
    - name: Collect only distributable packages
      shell: bash
      run: |
        set -euo pipefail
        if ! bash --noprofile --norc -e -o pipefail > "$RUNNER_TEMP/moke-private-build.log" 2>&1 <<'PRIVATE_BUILD'
        python3 - <<'PY'
        from pathlib import Path
        import os, shutil, hashlib, subprocess
        platform = os.environ['BUILD_PLATFORM']
        root = Path.cwd()
        out = root.parent / 'dist'
        out.mkdir(exist_ok=True)
        suffix = os.environ['BUILD_ID']
        if platform in ('linux', 'windows', 'macos'):
            base = root / 'src-tauri/target' / os.environ['BUILD_TARGET'] / 'release/bundle'
            extensions = {'linux': {'.deb', '.AppImage'}, 'windows': {'.msi', '.exe'}, 'macos': {'.dmg'}}[platform]
            files = [p for p in base.rglob('*') if p.is_file() and p.suffix in extensions]
        elif platform == 'android':
            files = list((root / 'android-release-artifacts').glob('*-signed.apk'))
            if not files: raise RuntimeError('No verified Android package found')
        elif platform == 'ohos':
            files = list((root / 'ohos-release-artifacts').glob('*-signed.hap'))
            if not files: raise RuntimeError('No verified OHOS package found')
        else:
            apps = list((root / 'src-tauri/gen/apple/build').glob('**/*.xcarchive/Products/Applications/*.app'))
            if len(apps) != 1: raise RuntimeError('Expected exactly one iOS application archive')
            payload_root = Path(os.environ['RUNNER_TEMP']) / 'moke-ipa'
            payload = payload_root / 'Payload'
            payload.mkdir(parents=True)
            shutil.copytree(apps[0], payload / apps[0].name, symlinks=True)
            ipa = out / f'Moke-Preview-{os.environ["BUILD_PUBLIC_VERSION"]}-{suffix}-unsigned.ipa'
            subprocess.run(['ditto', '-c', '-k', '--keepParent', str(payload), str(ipa)], check=True)
            files = []
        for p in files:
            target = out / f'Moke-Preview-{os.environ["BUILD_PUBLIC_VERSION"]}-{suffix}-{p.name}'
            if target.exists(): raise RuntimeError('Ambiguous package filename')
            shutil.copy2(p, target)
        packages = sorted(out.iterdir())
        if not packages: raise RuntimeError('No distributable packages found')
        (out / f'SHA256SUMS-{os.environ["BUILD_PUBLIC_VERSION"]}-{suffix}.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in packages))
        PY
        PRIVATE_BUILD
        then
          echo "::error::Private build step failed. Compiler output was withheld to keep private source out of public logs. Download the encrypted diagnostics artifact and decrypt it locally for details."
          exit 1
        fi
    - name: Upload Preview packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: preview-${{ matrix.id }}
        path: dist/*
        if-no-files-found: error
        retention-days: 7
    - name: Encrypt failed build diagnostics
      id: diagnostics
      if: failure()
      working-directory: ${{ runner.temp }}
      env:
        DIAGNOSTICS_CERT_BASE64: ${{ vars.MOKE_DIAGNOSTICS_CERT_BASE64 }}
      run: |
        set -euo pipefail
        umask 077
        if [ ! -s "$RUNNER_TEMP/moke-private-build.log" ]; then exit 0; fi
        test -n "$DIAGNOSTICS_CERT_BASE64"
        python3 - <<'PYCODE'
        import base64, os
        from pathlib import Path
        (Path(os.environ['RUNNER_TEMP']) / 'moke-diagnostics.crt').write_bytes(
            base64.b64decode(os.environ['DIAGNOSTICS_CERT_BASE64'], validate=True))
        PYCODE
        OPENSSL=openssl
        if [ "$RUNNER_OS" = macOS ]; then
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
        fi
        "$OPENSSL" cms -encrypt -binary -aes-256-cbc \
          -in "$RUNNER_TEMP/moke-private-build.log" \
          -outform DER -out "$RUNNER_TEMP/moke-diagnostics.cms.tmp" \
          "$RUNNER_TEMP/moke-diagnostics.crt"
        mv "$RUNNER_TEMP/moke-diagnostics.cms.tmp" "$RUNNER_TEMP/moke-diagnostics.cms"
        echo 'ready=true' >> "$GITHUB_OUTPUT"
    - name: Upload encrypted diagnostics
      if: failure() && steps.diagnostics.outputs.ready == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: encrypted-diagnostics-${{ matrix.id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/moke-diagnostics.cms
        if-no-files-found: error
        retention-days: 7
    - name: Remove private build diagnostics
      if: always()
      working-directory: ${{ runner.temp }}
      run: |
        rm -f "$RUNNER_TEMP/moke-private-build.log" "$RUNNER_TEMP/moke-diagnostics.crt" \
          "$RUNNER_TEMP/moke-diagnostics.cms.tmp" "$RUNNER_TEMP/moke-diagnostics.cms"
  publish:
    name: Publish tagged Preview packages
    needs:
    - resolve
    - build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - name: Download completed platform packages
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: preview-*
        merge-multiple: true
        path: dist
    - name: Publish public Latest release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
        PREVIEW_VERSION: ${{ needs.resolve.outputs.public_version }}
      run: |-
        set -euo pipefail
        cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
        Preview packages built from private main. All platform jobs use the same source revision.

        Android packages are signed and verified with the configured release key. OpenHarmony packages are signed and verified with the configured Release profile. iOS packages are unsigned and require signing before installation. Desktop bundles are not notarized. Automatic in-app updating is disabled; download updates from Releases. Preview entitlement verification remains enabled.
        NOTES
        # Annotated release tags carry reviewed notes without publishing private source.
        tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq 'select(.object.type == "tag") | .object.sha')"
        if [ -n "$tag_sha" ]; then
          gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.message' > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
        fi
        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          echo '::error::This release already exists. Use a new version tag; published packages will not be overwritten.'
          exit 1
        fi
        gh release create "$RELEASE_TAG" --verify-tag --latest --title "Moke Preview v$PREVIEW_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" dist/*
